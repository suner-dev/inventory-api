# Pipeline CI : compile + tests (unitaires + integration sur PostgreSQL reel)
name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventorydb
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests (unit + integration on real PostgreSQL)
        run: ./mvnw test
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/inventorydb
          TEST_DB_USERNAME: inventory
          TEST_DB_PASSWORD: inventory
