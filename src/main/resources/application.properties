# ========================
# PostgreSQL (toutes les valeurs externalisables via variables d'environnement)
# ========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventorydb}
spring.datasource.username=${DB_USERNAME:inventory}
spring.datasource.password=${DB_PASSWORD:inventory}

# ========================
# JPA / Hibernate — schema gere par Flyway (migrations versionnees)
# ========================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ========================
# Seuil de stock faible (regle metier centralisee et configurable)
# ========================
inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

# ========================
# Swagger / OpenAPI
# ========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ========================
# Server
# ========================
server.port=${SERVER_PORT:8080}
